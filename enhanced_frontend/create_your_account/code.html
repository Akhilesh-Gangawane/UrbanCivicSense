<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Your Account - UrbanSim AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FF6D40", // Coral orange as requested
                        "primary-hover": "#E65C30",
                        "background-light": "#F3F4F6",
                        "background-dark": "#0F0F14", // Deep dark background from n8n style
                        "card-light": "#FFFFFF",
                        "card-dark": "#18181E", // Slightly lighter dark for card
                        "input-border-light": "#E5E7EB",
                        "input-border-dark": "#2D2D39",
                        "text-main-light": "#111827",
                        "text-main-dark": "#FFFFFF",
                        "text-sub-light": "#6B7280",
                        "text-sub-dark": "#9CA3AF",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                    },
                },
            },
        };
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col justify-center items-center p-4 transition-colors duration-200">
<div class="absolute top-0 w-full p-6 flex justify-center">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary to-orange-400 flex items-center justify-center text-white font-bold text-lg shadow-lg">
<i class="fa-solid fa-city text-sm"></i>
</div>
<span class="text-xl font-bold text-text-main-light dark:text-text-main-dark tracking-tight">UrbanSim AI</span>
</div>
</div>
<div class="w-full max-w-md bg-card-light dark:bg-card-dark rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 p-8 sm:p-10 z-10">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-text-main-light dark:text-text-main-dark mb-2">Create your account</h1>
<p class="text-text-sub-light dark:text-text-sub-dark text-sm">
                Join the smartest city management platform
            </p>
</div>
<div class="grid grid-cols-2 gap-4 mb-6">
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white dark:bg-[#232329] border border-input-border-light dark:border-input-border-dark rounded-lg hover:bg-gray-50 dark:hover:bg-[#2a2a32] transition-colors text-sm font-medium text-text-main-light dark:text-text-main-dark">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYRkU8xzUTMjpzxjWGr3jYbIrmCzlapDBIXZuUU0fvKTTXD7ckfCjet5rtJuVijrQAQmmNv1kF5Yo3s08aN5RjBaqol3nMllsNanNUJPR1kbjB0rLo9SUS-4ug1ihaZaOQXB-AFrDWHrwj-Na9MJAjD52hTVBzOdaOLJeGUlEjsEiMBANwD_syxXpKqN7UIANcqS3bYSumewaVoWQHUG1agwnsxf7v9A1tlgEzNfOF0QuANB8Bq-1jJtU_xxAGAUwdHhJtWWhuaFU"/>
                Google
            </button>
<button class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white dark:bg-[#232329] border border-input-border-light dark:border-input-border-dark rounded-lg hover:bg-gray-50 dark:hover:bg-[#2a2a32] transition-colors text-sm font-medium text-text-main-light dark:text-text-main-dark">
<i class="fa-brands fa-github text-xl"></i>
                GitHub
            </button>
</div>
<div class="relative flex py-2 items-center mb-6">
<div class="flex-grow border-t border-input-border-light dark:border-input-border-dark"></div>
<span class="flex-shrink-0 mx-4 text-xs font-medium text-text-sub-light dark:text-text-sub-dark uppercase">Or with email</span>
<div class="flex-grow border-t border-input-border-light dark:border-input-border-dark"></div>
</div>
<form action="#" class="space-y-5" method="POST">
<div>
<label class="block text-xs font-semibold text-text-main-light dark:text-gray-300 mb-1.5 uppercase tracking-wide" for="fullname">Full Name</label>
<input class="w-full px-4 py-2.5 bg-white dark:bg-[#0F0F14] border border-input-border-light dark:border-input-border-dark rounded-lg text-text-main-light dark:text-text-main-dark placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow sm:text-sm" id="fullname" name="fullname" placeholder="e.g. Jane Doe" type="text"/>
</div>
<div>
<label class="block text-xs font-semibold text-text-main-light dark:text-gray-300 mb-1.5 uppercase tracking-wide" for="email">Work Email</label>
<input class="w-full px-4 py-2.5 bg-white dark:bg-[#0F0F14] border border-input-border-light dark:border-input-border-dark rounded-lg text-text-main-light dark:text-text-main-dark placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow sm:text-sm" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<label class="block text-xs font-semibold text-text-main-light dark:text-gray-300 mb-1.5 uppercase tracking-wide" for="mobile">Mobile Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
<span class="text-gray-500 dark:text-gray-400 sm:text-sm">+1</span>
</div>
<input class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-[#0F0F14] border border-input-border-light dark:border-input-border-dark rounded-lg text-text-main-light dark:text-text-main-dark placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow sm:text-sm" id="mobile" name="mobile" placeholder="(555) 123-4567" type="tel"/>
</div>
</div>
<div>
<label class="block text-xs font-semibold text-text-main-light dark:text-gray-300 mb-1.5 uppercase tracking-wide" for="password">Password</label>
<input class="w-full px-4 py-2.5 bg-white dark:bg-[#0F0F14] border border-input-border-light dark:border-input-border-dark rounded-lg text-text-main-light dark:text-text-main-dark placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow sm:text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
<p class="mt-2 text-xs text-text-sub-light dark:text-gray-500">
                    Must be at least 8 characters.
                </p>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors dark:ring-offset-[#18181E]" type="button">
                Create Account
            </button>
</form>
<p class="mt-8 text-center text-sm text-text-sub-light dark:text-text-sub-dark">
            Already have an account? 
            <a class="font-medium text-primary hover:text-primary-hover underline underline-offset-2 decoration-transparent hover:decoration-current transition-all" href="#">
                Sign in
            </a>
</p>
</div>
<div class="mt-8 text-center max-w-sm px-4">
<p class="text-xs text-gray-400 dark:text-gray-600">
            By clicking "Create Account", you agree to our Terms of Service and Privacy Policy.
        </p>
</div>
<script>
        // Simple script to detect system preference or support manual toggle logic if implemented
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>

</body></html>
