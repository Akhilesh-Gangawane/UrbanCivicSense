<script>
        // Initialize Leaflet Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([40.7128, -74.0060], 14); // New York coordinates
        // Dark/Light Mode Map Tile Logic
        const lightTiles = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
        const darkTiles = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
        let tileLayer = L.tileLayer(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? darkTiles : lightTiles, {
            maxZoom: 20
        }).addTo(map);
        // Listen for system theme changes to update map tiles
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            const newColorScheme = event.matches ? "dark" : "light";
            map.removeLayer(tileLayer);
            tileLayer = L.tileLayer(newColorScheme === "dark" ? darkTiles : lightTiles, { maxZoom: 20 }).addTo(map);
        });
        // Custom Icon Function
        function createCustomIcon(colorClass, iconName) {
            let bgColor = '';
            if(colorClass === 'water') bgColor = '#3B82F6';
            if(colorClass === 'electricity') bgColor = '#EAB308';
            if(colorClass === 'roads') bgColor = '#EF4444';
            if(colorClass === 'sanitation') bgColor = '#22C55E';
            return L.divIcon({
                className: 'custom-pin',
                html: `<div class="pin-inner" style="background-color: ${bgColor};">
                        <span class="material-icons-round text-white text-sm">${iconName}</span>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
        }
        // Add Dummy Markers
        const locations = [
            { lat: 40.7128, lng: -74.0060, type: 'roads', icon: 'add_road' }, // Center
            { lat: 40.7150, lng: -74.0020, type: 'water', icon: 'water_drop' },
            { lat: 40.7110, lng: -74.0090, type: 'electricity', icon: 'bolt' },
            { lat: 40.7180, lng: -74.0050, type: 'sanitation', icon: 'delete' },
            { lat: 40.7090, lng: -74.0030, type: 'roads', icon: 'add_road' },
            { lat: 40.7140, lng: -74.0110, type: 'water', icon: 'water_drop' },
        ];
        locations.forEach(loc => {
            L.marker([loc.lat, loc.lng], { icon: createCustomIcon(loc.type, loc.icon) }).addTo(map);
        });
        // Simulate interaction with the "Issue Card"
        // In a real app, clicking a marker would update and show this card.
        // Here we just keep it visible as per the design requirement.
    </script>
